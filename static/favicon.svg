<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA7FC2"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonCyan)" stroke-width="6" opacity="0.4"/>

  <!-- Cybernetic Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neonPink)" stroke-width="4" opacity="0.6"/>

  <!-- Futuristic Anime Star / Nova Spark (Central Motif) -->
  <path d="M256 64 C256 180 270 256 386 256 C270 256 256 332 256 448 C256 332 242 256 126 256 C242 256 256 180 256 64 Z" 
        fill="url(#neonCyan)" filter="url(#glow)"/>

  <!-- Central Pupil / Camera Core -->
  <circle cx="256" cy="256" r="54" fill="#09090b" stroke="url(#neonPink)" stroke-width="6"/>
  <circle cx="256" cy="256" r="30" fill="url(#neonPink)" filter="url(#glow)"/>
  <circle cx="242" cy="242" r="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="270" cy="270" r="5" fill="#ffffff" opacity="0.7"/>

  <!-- Corner Streamer Live Accents -->
  <circle cx="120" cy="120" r="12" fill="#22d3ee" opacity="0.8"/>
  <circle cx="392" cy="120" r="12" fill="#FA7FC2" opacity="0.8"/>
  <circle cx="120" cy="392" r="8" fill="#10b981" opacity="0.8"/>
  <circle cx="392" cy="392" r="10" fill="#a855f7" opacity="0.8"/>
</svg>
